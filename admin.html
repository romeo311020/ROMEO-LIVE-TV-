<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO ADMIN | Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #ffdf00;
            --dark-bg: #0b0d14;
            --card-bg: rgba(28, 31, 43, 0.8);
            --input-bg: #05060a;
            --glass: rgba(212, 175, 55, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--dark-bg); color: #fff; overflow-x: hidden; background-image: radial-gradient(circle at top right, #1a1d29, #0b0d14); min-height: 100vh; }

        /* --- Animations --- */
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glow { from { box-shadow: 0 0 5px var(--glass); } to { box-shadow: 0 0 20px var(--glass); } }

        /* --- Login Section --- */
        #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--glass);
            animation: fadeInScale 0.8s ease-out;
        }
        .github-logo { font-size: 70px; color: var(--gold); margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--glass)); }
        h1 { font-size: 28px; margin-bottom: 8px; font-weight: 900; background: linear-gradient(to right, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Inputs & Buttons --- */
        .form-group { margin-bottom: 20px; }
        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #2d3245;
            padding: 16px;
            border-radius: 15px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: var(--transition);
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--glass); transform: translateY(-2px); }

        .btn-gold {
            width: 100%;
            background: linear-gradient(45deg, var(--gold), var(--gold-bright));
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4); }

        /* --- Dashboard Area --- */
        #dashboard { display: none; padding: 40px 5%; animation: slideIn 0.6s ease-out; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .cat-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            animation: slideIn 0.5s ease-out backwards;
        }
        .cat-card:hover { border-color: var(--gold); background: var(--glass); transform: translateY(-10px); }
        .cat-card i { font-size: 40px; color: var(--gold); margin-bottom: 15px; }

        /* --- Channel List Area --- */
        #editorArea { display: none; padding: 30px 5%; animation: slideIn 0.5s ease-out; }
        .channel-row {
            background: rgba(255,255,255,0.03);
            margin-bottom: 12px;
            padding: 15px 25px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .channel-row:hover { background: rgba(255,255,255,0.08); border-color: var(--glass); }
        .chan-meta { display: flex; align-items: center; gap: 20px; }
        .chan-img-preview { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; border: 2px solid var(--glass); }

        /* --- Modal --- */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--glass);
            animation: fadeInScale 0.4s ease-out;
        }

        .loading-overlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #000; padding: 10px 30px;
            border-radius: 50px; font-weight: bold; display: none; z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">جاري الاتصال بـ GitHub...</div>

    <div id="loginScreen">
        <div class="login-card">
            <i class="fab fa-github github-logo"></i>
            <h1>ROMEO ADMIN</h1>
            <p style="margin-bottom: 30px; color: #888;">النظام الاحترافي لإدارة القنوات</p>
            <div class="form-group">
                <input type="password" id="ghToken" placeholder="GitHub Token (Classic)">
            </div>
            <div class="form-group">
                <input type="text" id="ghRepo" placeholder="username/repository">
            </div>
            <button class="btn-gold" onclick="proLogin()">دخول اللوحة الفاخرة</button>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div>
                <h1 style="font-size: 32px;">مرحباً بك، روماني</h1>
                <p style="color: var(--gold);">تحكم في عالمك الخاص</p>
            </div>
            <button onclick="location.reload()" style="background:none; border:1px solid #444; color:#fff; padding:10px 20px; border-radius:10px; cursor:pointer;">خروج</button>
        </header>
        <div class="cat-grid" id="categoryGrid"></div>
    </div>

    <div id="editorArea">
        <header style="margin-bottom: 20px;">
            <button onclick="closeEditor()" style="background:none; border:none; color:var(--gold); cursor:pointer; font-size:18px;">
                <i class="fas fa-chevron-right"></i> عودة للأقسام
            </button>
            <h2 id="catLabel" style="font-weight: 900; color: #fff;"></h2>
        </header>
        <button class="btn-gold" style="width: auto; padding: 12px 30px; margin-bottom: 30px;" onclick="openModal()">+ إضافة قناة للقسم</button>
        
        <div id="channelsContainer"></div>

        <div style="margin-top: 40px; padding: 20px; background: var(--glass); border-radius: 20px; text-align: center;">
            <p style="margin-bottom: 15px; font-size: 14px; color: #aaa;">تذكر: التغييرات تُحفظ فورياً في الذاكرة ولكن يجب مزامنتها مع السيرفر</p>
            <button class="btn-gold" onclick="syncWithGithub()">مزامنة البيانات مع GitHub الآن</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h2 id="modalTitle" style="margin-bottom: 25px; color: var(--gold);">إضافة قناة جديدة</h2>
            <div class="form-group"><input type="text" id="chName" placeholder="اسم القناة"></div>
            <div class="form-group"><input type="text" id="chImg" placeholder="رابط اللوجو (URL)"></div>
            <div class="form-group"><input type="text" id="chUrl" placeholder="رابط البث (Embed)"></div>
            <button class="btn-gold" onclick="commitChannel()">تأكيد البيانات</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#777; margin-top:15px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <script>
        let GH_TOKEN = "";
        let GH_REPO = "";
        let GH_SHA = "";
        let CHANNELS = [];
        let ACTIVE_CAT = "";
        let EDIT_ID = -1;

        const CATS = [
            { name: "On Time Sport", id: "ontime", icon: "fa-trophy" },
            { name: "beIN Sports", id: "bein", icon: "fa-futbol" },
            { name: "قنوات مصرية", id: "egypt", icon: "fa-flag" },
            { name: "قنوات سعودية", id: "saudi", icon: "fa-mosque" },
            { name: "أفلام وسينما", id: "movies", icon: "fa-film" },
            { name: "أطفال", id: "kids", icon: "fa-child" }
        ];

        async function proLogin() {
            GH_TOKEN = document.getElementById('ghToken').value;
            GH_REPO = document.getElementById('ghRepo').value;
            if(!GH_TOKEN || !GH_REPO) return alert("يرجى ملء البيانات");

            showLoading(true);
            try {
                const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/channels.json`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });
                if(!res.ok) throw new Error();
                const data = await res.json();
                GH_SHA = data.sha;
                CHANNELS = JSON.parse(atob(data.content));
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderCats();
            } catch (e) {
                alert("فشل الدخول: تأكد من التوكن وصحة ملف channels.json");
            } finally { showLoading(false); }
        }

        function renderCats() {
            const g = document.getElementById('categoryGrid');
            g.innerHTML = "";
            CATS.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = "cat-card";
                card.style.animationDelay = (i * 0.1) + "s";
                card.onclick = () => openEditor(c.id, c.name);
                card.innerHTML = `<i class="fas ${c.icon}"></i><h3>${c.name}</h3>`;
                g.appendChild(card);
            });
        }

        function openEditor(id, name) {
            ACTIVE_CAT = id;
            document.getElementById('catLabel').innerText = name;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            renderChannels();
        }

        function renderChannels() {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = "";
            CHANNELS.forEach((ch, idx) => {
                if(ch.cat === ACTIVE_CAT) {
                    container.innerHTML += `
                        <div class="channel-row">
                            <div class="chan-meta">
                                <img src="${ch.img}" class="chan-img-preview">
                                <div>
                                    <div style="font-weight:bold;">${ch.name}</div>
                                    <div style="font-size:10px; color:#666;">${ch.url.substring(0, 30)}...</div>
                                </div>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button onclick="openEdit(${idx})" style="background:none; border:none; color:var(--gold); cursor:pointer;"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteChan(${idx})" style="background:none; border:none; color:#ff4d4d; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function openModal() {
            EDIT_ID = -1;
            document.getElementById('modalTitle').innerText = "إضافة قناة جديدة";
            document.getElementById('chName').value = "";
            document.getElementById('chImg').value = "";
            document.getElementById('chUrl').value = "";
            document.getElementById('modal').style.display = 'flex';
        }

        function openEdit(idx) {
            EDIT_ID = idx;
            const ch = CHANNELS[idx];
            document.getElementById('modalTitle').innerText = "تعديل بيانات القناة";
            document.getElementById('chName').value = ch.name;
            document.getElementById('chImg').value = ch.img;
            document.getElementById('chUrl').value = ch.url;
            document.getElementById('modal').style.display = 'flex';
        }

        function commitChannel() {
            const name = document.getElementById('chName').value;
            const img = document.getElementById('chImg').value;
            const url = document.getElementById('chUrl').value;
            
            if(!name || !url) return alert("الاسم والرابط ضروريان");

            const obj = { name, img, url, cat: ACTIVE_CAT };

            if(EDIT_ID === -1) CHANNELS.push(obj);
            else CHANNELS[EDIT_ID] = obj;

            closeModal();
            renderChannels();
        }

        function deleteChan(idx) {
            if(confirm("حذف هذه القناة نهائياً؟")) {
                CHANNELS.splice(idx, 1);
                renderChannels();
            }
        }

        async function syncWithGithub() {
            showLoading(true);
            try {
                // استخدام unescape لضمان دعم اللغة العربية في Base64
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(CHANNELS, null, 2))));
                const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/channels.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Pro Admin Update",
                        content: content,
                        sha: GH_SHA
                    })
                });
                const resData = await res.json();
                GH_SHA = resData.content.sha;
                alert("✨ تم تحديث السيرفر بنجاح!");
            } catch (e) {
                alert("خطأ في المزامنة");
            } finally { showLoading(false); }
        }

        function showLoading(show) { document.getElementById('loading').style.display = show ? 'block' : 'none'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeEditor() {
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('editorArea').style.display = 'none';
        }
    </script>
</body>
</html>
