<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO ADMIN | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #ffc107;
            --dark-bg: #12141d;
            --card-bg: #1c1f2b;
            --input-bg: #0a0c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--dark-bg); color: #fff; }

        /* --- Login Screen --- */
        #loginScreen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .github-logo { font-size: 60px; color: var(--gold); margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 900; letter-spacing: 1px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }

        .form-group { margin-bottom: 15px; position: relative; }
        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #2d3245;
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: var(--gold); }

        .btn-login {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        /* --- Dashboard Screen --- */
        #dashboard { display: none; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .cat-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cat-item:hover { border-color: var(--gold); }

        /* --- Channels Editor --- */
        #editorArea { display: none; }
        .channel-item {
            background: var(--card-bg);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chan-info { display: flex; align-items: center; gap: 15px; }
        .chan-img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
        .actions button {
            background: none; border: none; color: #888; margin-left: 10px; cursor: pointer; font-size: 18px;
        }
        .btn-add { background: var(--gold); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; border: none; cursor: pointer; }
        
        /* Modal */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <i class="fab fa-github github-logo"></i>
            <h1>ROMEO ADMIN</h1>
            <p>سجل الدخول باستخدام بيانات GitHub</p>
            <div class="form-group">
                <input type="password" id="ghToken" placeholder="GitHub Personal Access Token">
            </div>
            <div class="form-group">
                <input type="text" id="ghRepo" placeholder="username/repository">
            </div>
            <button class="btn-login" onclick="login()">دخول إلى اللوحة</button>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <h2>الأقسام</h2>
            <button onclick="logout()" style="color:red; background:none; border:none;">خروج</button>
        </header>
        <div class="cat-list" id="categoryGrid"></div>
    </div>

    <div id="editorArea" style="padding: 20px;">
        <button onclick="showDashboard()" style="color:var(--gold); margin-bottom: 20px; background:none; border:none; cursor:pointer;">
            <i class="fas fa-arrow-right"></i> العودة للأقسام
        </button>
        <h2 id="currentCatLabel" style="margin-bottom: 20px;">اسم القسم</h2>
        <button class="btn-add" onclick="openModal()">+ إضافة قناة جديدة</button>
        <div id="channelsList"></div>
        <button class="btn-login" style="margin-top: 30px;" onclick="saveToGithub()">حفظ التغييرات النهائية إلى GitHub</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">إضافة قناة</h3><br>
            <input type="text" id="chName" placeholder="اسم القناة"><br><br>
            <input type="text" id="chImg" placeholder="رابط صورة القناة"><br><br>
            <input type="text" id="chUrl" placeholder="رابط بث القناة (Embed)"><br><br>
            <button class="btn-login" onclick="confirmAdd()">تأكيد</button>
            <button onclick="closeModal()" style="width:100%; background:none; color:#888; border:none; margin-top:10px;">إلغاء</button>
        </div>
    </div>

    <script>
        let G_TOKEN = "";
        let G_REPO = "";
        let G_DATA = [];
        let G_SHA = "";
        let currentCat = "";
        let editIndex = -1;

        const categories = [
            { name: "On Time Sport", id: "ontime", icon: "fa-trophy" },
            { name: "beIN Sports", id: "bein", icon: "fa-futbol" },
            { name: "قنوات مصرية", id: "egypt", icon: "fa-flag" },
            { name: "قنوات سعودية", id: "saudi", icon: "fa-mosque" },
            { name: "قنوات MBC", id: "mbc", icon: "fa-star" },
            { name: "أفلام وسينما", id: "movies", icon: "fa-film" }
        ];

        async function login() {
            G_TOKEN = document.getElementById('ghToken').value;
            G_REPO = document.getElementById('ghRepo').value;
            if(!G_TOKEN || !G_REPO) return alert("يرجى إدخال البيانات");
            
            try {
                // جلب الملف من جيت هب
                const res = await fetch(`https://api.github.com/repos/${G_REPO}/contents/channels.json`, {
                    headers: { 'Authorization': `token ${G_TOKEN}` }
                });
                const json = await res.json();
                G_SHA = json.sha;
                G_DATA = JSON.parse(atob(json.content));
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderCategories();
            } catch (e) {
                alert("خطأ في الاتصال: تأكد من التوكن واسم المستودع وجود ملف channels.json");
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = "";
            categories.forEach(cat => {
                grid.innerHTML += `
                    <div class="cat-item" onclick="openEditor('${cat.id}', '${cat.name}')">
                        <i class="fas ${cat.icon}" style="font-size:30px; color:var(--gold); margin-bottom:10px;"></i>
                        <div>${cat.name}</div>
                    </div>
                `;
            });
        }

        function openEditor(id, name) {
            currentCat = id;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            document.getElementById('currentCatLabel').innerText = name;
            renderChannels();
        }

        function showDashboard() {
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('editorArea').style.display = 'none';
        }

        function renderChannels() {
            const list = document.getElementById('channelsList');
            list.innerHTML = "";
            G_DATA.forEach((ch, index) => {
                if(ch.cat === currentCat) {
                    list.innerHTML += `
                        <div class="channel-item">
                            <div class="chan-info">
                                <img src="${ch.img}" class="chan-img">
                                <span>${ch.name}</span>
                            </div>
                            <div class="actions">
                                <button onclick="editChannel(${index})"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteChannel(${index})" style="color:#ff4444;"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function openModal() {
            editIndex = -1;
            document.getElementById('chName').value = "";
            document.getElementById('chImg').value = "";
            document.getElementById('chUrl').value = "";
            document.getElementById('modal').style.display = 'flex';
        }

        function editChannel(index) {
            editIndex = index;
            const ch = G_DATA[index];
            document.getElementById('chName').value = ch.name;
            document.getElementById('chImg').value = ch.img;
            document.getElementById('chUrl').value = ch.url;
            document.getElementById('modalTitle').innerText = "تعديل قناة";
            document.getElementById('modal').style.display = 'flex';
        }

        function confirmAdd() {
            const newChan = {
                name: document.getElementById('chName').value,
                img: document.getElementById('chImg').value,
                url: document.getElementById('chUrl').value,
                cat: currentCat
            };

            if(editIndex === -1) {
                G_DATA.push(newChan);
            } else {
                G_DATA[editIndex] = newChan;
            }
            
            closeModal();
            renderChannels();
        }

        function deleteChannel(index) {
            if(confirm("هل أنت متأكد من الحذف؟")) {
                G_DATA.splice(index, 1);
                renderChannels();
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function saveToGithub() {
            if(!confirm("سيتم تحديث الملف على GitHub الآن، هل أنت متأكد؟")) return;
            
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(G_DATA, null, 2))));
                const res = await fetch(`https://api.github.com/repos/${G_REPO}/contents/channels.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${G_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Update channels via Admin Panel",
                        content: content,
                        sha: G_SHA
                    })
                });
                
                if(res.ok) {
                    const resJson = await res.json();
                    G_SHA = resJson.content.sha;
                    alert("تم الحفظ بنجاح!");
                } else {
                    alert("فشل الحفظ، تأكد من صلاحيات التوكن");
                }
            } catch (e) {
                alert("خطأ أثناء الحفظ");
            }
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
