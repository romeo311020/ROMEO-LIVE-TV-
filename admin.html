<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO TV | إدارة القنوات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f9d423; --bg: #050811; --card: #111827; --danger: #ff4757; --input-bg: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; }

        /* شاشة التحميل والمزامنة */
        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--gold); width: 40px; height: 40px; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .back-btn { background: #1e293b; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; border: none; color: white; }

        /* البطاقات والأزرار */
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .box { background: var(--card); padding: 25px; border-radius: 18px; display: flex; align-items: center; gap: 15px; border: 1px solid #1e293b; cursor: pointer; transition: 0.3s; }
        .box:hover { border-color: var(--gold); background: #161e2d; }
        
        .channel-item { background: var(--card); padding: 12px; border-radius: 12px; display: flex; gap: 15px; margin-bottom: 10px; border: 1px solid #1e293b; align-items: center; }
        .channel-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: contain; background: #000; }
        .info { flex: 1; }
        .actions { display: flex; gap: 15px; margin-top: 5px; }
        .act-btn { cursor: pointer; font-size: 13px; font-weight: bold; }

        input, select { width: 100%; padding: 15px; margin-bottom: 15px; background: var(--input-bg); border: 1px solid #374151; border-radius: 10px; color: #fff; outline: none; }
        .save-btn { background: var(--gold); color: #000; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:15px">جاري تحديث البيانات على GitHub...</p>
</div>

<!-- شاشة تسجيل الدخول[span_2](start_span)[span_2](end_span) -->
<div id="screen-login" class="screen active-screen">
    <div style="text-align:center; max-width: 400px; margin: 80px auto;">
        <h1 style="color:var(--gold); font-size: 40px; margin-bottom: 10px;">ROMEO ADMIN</h1>
        <p style="opacity: 0.7; margin-bottom: 30px;">أدخل بيانات GitHub للتحكم في القنوات</p>
        <input type="password" id="token" placeholder="GitHub Personal Access Token">
        <input type="text" id="repo" placeholder="المستودع (مثال: username/repo-name)">
        <button class="save-btn" onclick="login()">دخول للوحة التحكم 🔓</button>
    </div>
</div>

<header id="nav" style="display:none">
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">⬅ رجوع</button>
    <div style="font-weight:900; color: var(--gold);">إدارة البث المباشر</div>
</header>

<!-- الشاشة الرئيسية: الأقسام[span_3](start_span)[span_3](end_span) -->
<div id="screen-home" class="screen">
    <h2>أقسام القنوات 📺</h2>
    <div class="grid">
        <div class="box" onclick="openCategory('beIN')"><i class="fas fa-star" style="color:#7d2ae8"></i> <b>beIN SPORTS</b></div>
        <div class="box" onclick="openCategory('OnSport')"><i class="fas fa-futbol" style="color:#e91e63"></i> <b>OnSport</b></div>
        <div class="box" onclick="openCategory('MBC')"><i class="fas fa-tv" style="color:#00bcd4"></i> <b>MBC & SHAHID</b></div>
        <div class="box" onclick="openCategory('News')"><i class="fas fa-globe" style="color:#4caf50"></i> <b>قنوات الأخبار</b></div>
    </div>
</div>

<!-- شاشة عرض القنوات[span_4](start_span)[span_4](end_span) -->
<div id="screen-channels" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 id="cat-title">القنوات</h2>
        <button onclick="openForm()" style="background:var(--gold); color:#000; padding:8px 15px; border-radius:8px; border:none; font-weight:bold;">➕ إضافة قناة</button>
    </div>
    <div id="channels-list"></div>
</div>

<!-- نموذج الإضافة والتعديل[span_5](start_span)[span_5](end_span) -->
<div id="screen-form" class="screen">
    <div style="max-width: 500px; margin: 0 auto;">
        <h2 id="form-title" style="margin-bottom: 20px;">إضافة قناة جديدة</h2>
        <input type="hidden" id="editId">
        <label>اسم القناة:</label>
        <input type="text" id="name" placeholder="مثال: beIN Sports 1">
        <label>رابط اللوجو:</label>
        <input type="text" id="img" placeholder="رابط الصورة المباشر">
        <label>رابط البث (M3U8):</label>
        <input type="text" id="link" placeholder="http://.../index.m3u8">
        <button class="save-btn" onclick="saveData()">حفظ وإرسال للموقع ✅</button>
    </div>
</div>

<script>
    let channels = [];
    let config = { token: '', repo: '' };
    let currentCat = '';

    // الدخول وجلب البيانات من ملف channels.json[span_6](start_span)[span_6](end_span)
    async function login() {
        config.token = document.getElementById('token').value;
        config.repo = document.getElementById('repo').value;
        if(!config.token || !config.repo) return alert("يرجى إدخال البيانات");
        
        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/channels.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            channels = content;
            
            document.getElementById('screen-login').classList.remove('active-screen');
            document.getElementById('nav').style.display = 'flex';
            showScreen('screen-home');
        } catch (e) { alert("فشل الاتصال! تأكد من التوكن واسم المستودع ووجود ملف channels.json"); }
        showLoader(false);
    }

    function openCategory(cat) {
        currentCat = cat;
        document.getElementById('cat-title').innerText = `قنوات ${cat}`;
        renderChannels();
        showScreen('screen-channels');
    }

    function renderChannels() {
        const list = document.getElementById('channels-list');
        list.innerHTML = '';
        const filtered = channels.filter(c => c.category === currentCat);
        
        filtered.forEach(ch => {
            list.innerHTML += `
                <div class="channel-item">
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="info">
                        <b>${ch.name}</b>
                        <div class="actions">
                            <span class="act-btn" style="color:#2e86de" onclick="editChannel('${ch.id}')">📝 تعديل</span>
                            <span class="act-btn" style="color:var(--danger)" onclick="deleteChannel('${ch.id}')">🗑️ حذف</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    function openForm(id = null) {
        document.getElementById('editId').value = id || '';
        document.getElementById('name').value = '';
        document.getElementById('img').value = '';
        document.getElementById('link').value = '';
        if(!id) document.getElementById('form-title').innerText = "إضافة قناة جديدة";
        showScreen('screen-form');
    }

    function editChannel(id) {
        const ch = channels.find(c => c.id == id);
        openForm(id);
        document.getElementById('name').value = ch.name;
        document.getElementById('img').value = ch.logo;
        document.getElementById('link').value = ch.url;
        document.getElementById('form-title').innerText = "تعديل بيانات القناة";
    }

    async function deleteChannel(id) {
        if(confirm("هل أنت متأكد من حذف هذه القناة؟")) {
            channels = channels.filter(c => c.id != id);
            await syncWithGithub();
            renderChannels();
        }
    }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('name').value;
        const img = document.getElementById('img').value;
        const link = document.getElementById('link').value;

        if(!name || !link) return alert("الاسم والرابط مطلوبان");

        const newCh = {
            id: id || Date.now().toString(),
            name,
            logo: img,
            url: link,
            category: currentCat
        };

        if(id) {
            const idx = channels.findIndex(c => c.id == id);
            channels[idx] = newCh;
        } else {
            channels.push(newCh);
        }

        await syncWithGithub();
        showScreen('screen-channels');
        renderChannels();
    }

    // مزامنة البيانات مع GitHub (تحديث ملف JSON)[span_7](start_span)[span_7](end_span)
    async function syncWithGithub() {
        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/channels.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(channels, null, 2))));
            
            await fetch(`https://api.github.com/repos/${config.repo}/contents/channels.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}` },
                body: JSON.stringify({
                    message: "تحديث روابط القنوات من لوحة التحكم",
                    content: content,
                    sha: file.sha
                })
            });
        } catch (e) { alert("حدث خطأ أثناء الحفظ على GitHub!"); }
        showLoader(false);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        document.getElementById('backBtn').style.display = (id === 'screen-home') ? 'none' : 'block';
    }

    function goBack() {
        const active = document.querySelector('.active-screen').id;
        if(active === 'screen-channels') showScreen('screen-home');
        else if(active === 'screen-form') showScreen('screen-channels');
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
</script>
</body>
</html>
