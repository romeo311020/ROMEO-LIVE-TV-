<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV | PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --main-bg: #050811;
            --card-bg: #121829;
            --accent-gold: #f9d423;
            --accent-red: #ff3b3b;
            --text-gray: #a0a6b5;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--main-bg); color: white; padding-bottom: 70px; overflow-x: hidden; font-size: 13px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(5, 8, 17, 0.95);
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px);
        }
        .logo-text { font-size: 18px; font-weight: 900; order: 1; }
        .logo-text span { color: var(--accent-gold); }
        .btn-download {
            background: linear-gradient(45deg, #f9d423, #ff9d00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            text-decoration: none; font-weight: bold; font-size: 11px; order: 2;
        }

        .ticker-wrapper { background: var(--accent-red); color: white; padding: 4px 0; overflow: hidden; white-space: nowrap; font-size: 10px; font-weight: bold; }
        .ticker-text { display: inline-block; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .search-area { padding: 8px 15px; }
        .search-wrapper { position: relative; background: var(--card-bg); border-radius: 10px; border: 1px solid #232a3d; }
        .search-wrapper input { width: 100%; background: transparent; border: none; padding: 8px 35px 8px 10px; color: white; outline: none; font-size: 12px; }
        .search-wrapper i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--accent-gold); font-size: 14px; }

        .main-category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 15px; }
        .cat-btn {
            height: 60px; border-radius: 10px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid #232a3d; background-size: cover; background-position: center;
        }
        .cat-btn::before { content: ""; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .cat-btn span { font-weight: bold; font-size: 12px; z-index: 2; }

        .section-header { padding: 10px 15px 5px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #232a3d; }
        
        .matches-widget { padding: 10px 15px; min-height: 50px; }
        #noMatchesMsg { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 10px; border: 1px solid #232a3d; display: none; }

        .channel-container { padding: 5px 15px; display: flex; flex-direction: column; gap: 8px; }
        .channel-card { background: var(--card-bg); border: 1px solid #1f263e; border-radius: 12px; display: flex; align-items: center; padding: 8px 12px; cursor: pointer; }
        .ch-logo { width: 35px; height: 35px; border-radius: 6px; object-fit: contain; background: #000; }
        .ch-info { flex: 1; margin-right: 12px; }
        .ch-name { font-weight: bold; font-size: 12px; }
        .play-btn { color: var(--accent-gold); font-size: 18px; }

        #playerUI { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: none; flex-direction: column; }
        .player-nav { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); }
        .video-container { flex: 1; display: flex; align-items: center; background: #000; }
        video { width: 100%; }
        .banner-exclusive { padding: 10px; text-align: center; background: #080b14; color: var(--accent-gold); font-weight: bold; font-size: 13px; }
        .player-footer { padding: 15px; display: flex; gap: 8px; background: #050811; }
        .f-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .f-btn.main { background: var(--accent-gold); color: #000; }
        .f-btn.sec { background: #232a3d; color: #fff; }

        .bottom-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #0a0e1a; border-top: 1px solid #1f263e; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { text-decoration: none; color: var(--text-gray); text-align: center; font-size: 10px; }
        .nav-link i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-link.active { color: var(--accent-gold); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="btn-download" target="_blank">تنزيل التطبيق</a>
</header>

<div class="ticker-wrapper">
    <div class="ticker-text">
        &nbsp;&nbsp;&nbsp;&nbsp; تم تحديث قناة OnSport .. تابع البث المباشر الآن بدون تقطيع عبر ROMEO LIVE TV .. مشاهدة ممتعة &nbsp;&nbsp;&nbsp;&nbsp;
    </div>
</div>

<div class="search-area">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن قناة...">
    </div>
</div>

<div class="main-category-grid">
    <div class="cat-btn" style="background-image: url('https://i.postimg.cc/VNMwcc3n/images.png');" onclick="filterChannels('beIN')"><span>beIN SPORTS</span></div>
    <div class="cat-btn" style="background-image: url('https://i.postimg.cc/dDMRprdw/images-(37).jpg');" onclick="filterChannels('MBC')"><span>MBC & SHAHID</span></div>
    <div class="cat-btn" style="background-image: url('https://i.postimg.cc/V6jvFh14/images-(39).jpg');" onclick="filterChannels('OnSport')"><span>OnSport</span></div>
    <div class="cat-btn" style="background-image: url('https://static.dw.com/image/18776694_605.jpg');" onclick="filterChannels('News')"><span>قنوات الأخبار</span></div>
</div>

<div class="section-header">مباريات اليوم الحقيقية</div>
<div class="matches-widget">
    <div id="fs-wm-539050" class="fs-widget" data-token="539050" data-league="" data-team="" data-sport="1" data-type="1" data-theme="dark" data-width="100%" data-height="auto"></div>
    <script async src="https://widget.footystats.org/m/539050"></script>
    <div id="noMatchesMsg">
        <i class="fas fa-clock" style="font-size:24px; color:var(--accent-gold); margin-bottom:5px;"></i>
        <p style="font-size:11px;">لا توجد مباريات جارية حالياً</p>
    </div>
</div>

<div class="section-header">قنوات مميزة</div>
<div class="channel-container" id="channelList"></div>

<div id="playerUI">
    <div class="player-nav"><i class="fas fa-chevron-right" onclick="closePlayer()"></i><span id="nowPlayingTitle">بث مباشر</span><i></i></div>
    <div class="video-container"><video id="mainVideo" controls autoplay playsinline></video></div>
    <div class="banner-exclusive" id="bannerTxt">ROMEO LIVE TV</div>
    <div class="player-footer">
        <button class="f-btn main" onclick="toggleFS()">ملء الشاشة</button>
        <button class="f-btn sec" onclick="exitToLink()">رجوع</button>
    </div>
</div>

<nav class="bottom-bar">
    <a href="javascript:location.reload();" class="nav-link active"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="https://wa.me/201286716976" class="nav-link" target="_blank"><i class="fab fa-whatsapp"></i>تواصل معنا</a>
</nav>

<script>
    const IPTV_URL = 'https://iptv-org.github.io/iptv/languages/ara.m3u';
    let allChannels = [];
    const video = document.getElementById('mainVideo');
    const hls = new Hls();

    function checkMatchesLoad() {
        setTimeout(() => {
            const widget = document.getElementById('fs-wm-539050');
            const msg = document.getElementById('noMatchesMsg');
            if (widget && widget.offsetHeight < 50) {
                widget.style.display = 'none';
                msg.style.display = 'block';
            }
        }, 4000);
    }

    async function fetchAllChannels() {
        try {
            const response = await fetch(IPTV_URL);
            const data = await response.text();
            const lines = data.split('\n');
            
            const fixed = [
                { name: "OnSport", logo: "https://i.postimg.cc/V6jvFh14/images-(39).jpg", url: "https://v-eg.m-iptv.com/ontime1/index.m3u8" },
                { name: "beIN SPORTS NEWS", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/news.m3u8" }
            ];
            
            allChannels = [...fixed];
            lines.forEach((line, i) => {
                if (line.startsWith('#EXTINF:')) {
                    const name = line.split(',')[1]?.trim();
                    const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || 'https://via.placeholder.com/40';
                    const url = lines[i+1]?.trim();
                    if (url && url.startsWith('http')) allChannels.push({ name, logo, url });
                }
            });
            displayChannels(allChannels);
        } catch(e) { }
    }

    function displayChannels(list) {
        const container = document.getElementById('channelList');
        container.innerHTML = '';
        list.slice(0, 150).forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.innerHTML = `<img src="${ch.logo}" class="ch-logo"><div class="ch-info"><div class="ch-name">${ch.name}</div></div><i class="fas fa-play-circle play-btn"></i>`;
            card.onclick = () => openPlayer(ch.url, ch.name);
            container.appendChild(card);
        });
    }

    function filterChannels(keyword) {
        displayChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(keyword.toLowerCase())));
    }

    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        displayChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val)));
    };

    function openPlayer(url, name) {
        document.getElementById('playerUI').style.display = 'flex';
        document.getElementById('nowPlayingTitle').innerText = name;
        document.getElementById('bannerTxt').innerText = `حصرياً قناة (${name}) على ROMEO LIVE TV`;
        if (Hls.isSupported()) { hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => video.play()); }
        else { video.src = url; video.play(); }
    }

    function closePlayer() { document.getElementById('playerUI').style.display = 'none'; video.pause(); hls.detachMedia(); }
    function toggleFS() { if (video.requestFullscreen) video.requestFullscreen(); }
    function exitToLink() { window.location.href = "https://romeo311020.github.io/romeo-live-tv-31/"; }

    fetchAllChannels();
    checkMatchesLoad();
</script>
</body>
</html>
