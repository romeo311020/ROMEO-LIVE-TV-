<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROMEO LIVE TV | Premium Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --dark-gold: #a68a2d;
            --bg-black: #080808;
            --card-bg: #121212;
            --glass: rgba(212, 175, 55, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        /* --- Header & Search Bar --- */
        header {
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--glass);
            position: sticky;
            top: 0; z-index: 1000;
        }

        .search-wrapper {
            flex-grow: 1;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 10px 40px 10px 15px;
            border-radius: 50px;
            color: #fff;
            outline: none;
            transition: var(--transition);
        }

        .search-wrapper input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .search-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
        }

        /* --- Hero Section --- */
        .premium-banner {
            margin: 15px 5%;
            height: 180px;
            background: linear-gradient(45deg, #000, #1a1a1a);
            border-radius: 20px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .premium-banner h2 { font-size: 2rem; color: var(--gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

        /* --- Categories Grid --- */
        .section-header { padding: 20px 5% 10px; display: flex; align-items: center; justify-content: space-between; }
        .section-header h3 { color: var(--gold); font-size: 1.2rem; }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 12px;
            padding: 10px 5%;
        }

        .cat-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid #1f1f1f;
            transition: var(--transition);
            cursor: pointer;
            animation: fadeIn 0.5s ease forwards;
        }

        .cat-card:hover { transform: scale(1.05); border-color: var(--gold); background: var(--glass); }

        .cat-card i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; display: block; }

        .cat-card span { font-size: 0.8rem; font-weight: bold; }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Full Screen Player --- */
        .player-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .video-container { flex-grow: 1; background: #000; }
        .video-container iframe { width: 100%; height: 100%; border: none; }

        .player-nav {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
        }

        /* --- Bottom Nav --- */
        .bottom-bar {
            position: fixed;
            bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.98);
            border-top: 1px solid var(--gold);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-btn { color: #888; text-decoration: none; text-align: center; font-size: 0.7rem; }
        .nav-btn i { font-size: 1.4rem; display: block; }
        .nav-btn.active { color: var(--gold); }

        /* --- Back Button --- */
        .back-area { padding: 10px 5%; display: none; }
        .btn-back { background: var(--gold); color: #000; border: none; padding: 8px 20px; border-radius: 5px; font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <div class="logo" style="color: var(--gold); font-weight: 900;">ROMEO</div>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن قناة..." onkeyup="filterChannels()">
        </div>
    </header>

    <div id="mainView">
        <div class="premium-banner">
            <div>
                <h2>ROMEO LIVE TV</h2>
                <p style="color: #888;">استمتع بالبث المباشر الفاخر</p>
            </div>
        </div>

        <div class="section-header"><h3>الأقسام الرئيسية</h3></div>
        <div class="cat-grid" id="categoryGrid">
            </div>
    </div>

    <div id="channelView" style="display: none;">
        <div class="back-area" style="display: block;">
            <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-right"></i> العودة</button>
        </div>
        <div class="section-header"><h3 id="catTitle">اسم القسم</h3></div>
        <div class="cat-grid" id="channelList">
            </div>
    </div>

    <div id="playerOverlay" class="player-overlay">
        <div class="player-nav">
            <span id="nowPlaying" style="color: var(--gold); font-weight: bold;">جاري التحميل...</span>
            <i class="fas fa-times" onclick="closePlayer()" style="font-size: 1.5rem; cursor: pointer;"></i>
        </div>
        <div class="video-container">
            <iframe id="videoFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="#" class="nav-btn active" onclick="goBack()"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="https://romeo311020.github.io/romeo-live-tv-31/" class="nav-btn"><i class="fas fa-globe"></i>الموقع</a>
        <a href="https://wa.me/201027675035" class="nav-btn"><i class="fab fa-whatsapp"></i>تواصل</a>
    </div>

    <script>
        const categories = [
            { name: "On Time Sport", icon: "fa-trophy", id: "ontime" },
            { name: "beIN Sports", icon: "fa-futbol", id: "bein" },
            { name: "قنوات مصرية", icon: "fa-flag", id: "egypt" },
            { name: "قنوات سعودية", icon: "fa-mosque", id: "saudi" },
            { name: "قنوات MBC", icon: "fa-star", id: "mbc" },
            { name: "أفلام وسينما", icon: "fa-film", id: "movies" },
            { name: "أطفال", icon: "fa-child", id: "kids" },
            { name: "قنوات وثائقية", icon: "fa-leaf", id: "doc" },
            { name: "قنوات إخبارية", icon: "fa-newspaper", id: "news" },
            { name: "قنوات مسيحية", icon: "fa-cross", id: "christian" }
        ];

        // مصفوفة القنوات الآن فارغة تماماً
        let allChannels = []; 

        // دالة جديدة لجلب البيانات من JSON الخارجي على GitHub
        async function fetchChannelsFromGithub() {
            try {
                // استبدل هذا الرابط برابط ملف الـ JSON الخام (Raw) الخاص بك على GitHub لاحقاً
                const response = await fetch('channels.json'); 
                allChannels = await response.json();
                console.log("Channels Loaded Successfully");
            } catch (error) {
                console.error("Error Loading JSON:", error);
            }
        }

        function init() {
            const grid = document.getElementById('categoryGrid');
            categories.forEach(cat => {
                grid.innerHTML += `
                    <div class="cat-card" onclick="openCategory('${cat.id}', '${cat.name}')">
                        <i class="fas ${cat.icon}"></i>
                        <span>${cat.name}</span>
                    </div>
                `;
            });
            fetchChannelsFromGithub(); // جلب القنوات عند التشغيل
        }

        function openCategory(id, name) {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('channelView').style.display = 'block';
            document.getElementById('catTitle').innerText = name;
            
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            
            const filtered = allChannels.filter(ch => ch.cat === id);
            if(filtered.length === 0) {
                list.innerHTML = '<p style="padding:20px; color:#888;">سيتم إضافة القنوات قريباً...</p>';
            } else {
                filtered.forEach(ch => {
                    list.innerHTML += `
                        <div class="cat-card" onclick="playChannel('${ch.url}', '${ch.name}')">
                            <img src="${ch.img || ''}" style="width:100%; border-radius:10px; margin-bottom:10px; display:${ch.img ? 'block' : 'none'}">
                            <i class="fas fa-play-circle" style="display:${ch.img ? 'none' : 'block'}"></i>
                            <span>${ch.name}</span>
                        </div>
                    `;
                });
            }
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('mainView').style.display = 'block';
            document.getElementById('channelView').style.display = 'none';
        }

        function playChannel(url, name) {
            document.getElementById('playerOverlay').style.display = 'flex';
            document.getElementById('nowPlaying').innerText = name;
            // تعديل الرابط ليتناسب مع روابط aflam4you ويفتح كـ embed
            let finalUrl = url;
            if(url.includes('embed.php') || url.includes('.html')) {
                finalUrl = url;
            }
            document.getElementById('videoFrame').src = finalUrl;
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            document.getElementById('playerOverlay').style.display = 'none';
            document.getElementById('videoFrame').src = '';
            document.body.style.overflow = 'auto';
        }

        function filterChannels() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            if(input.length > 0) {
                document.getElementById('mainView').style.display = 'none';
                document.getElementById('channelView').style.display = 'block';
                document.getElementById('catTitle').innerText = "نتائج البحث";
                const list = document.getElementById('channelList');
                list.innerHTML = '';
                const results = allChannels.filter(ch => ch.name.toLowerCase().includes(input));
                results.forEach(ch => {
                    list.innerHTML += `
                        <div class="cat-card" onclick="playChannel('${ch.url}', '${ch.name}')">
                            <i class="fas fa-play-circle"></i>
                            <span>${ch.name}</span>
                        </div>
                    `;
                });
            } else {
                goBack();
            }
        }

        window.onload = init;
    </script>

    <style>
        .cat-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s !important;
            animation: slideUp 0.6s ease-out backwards !important;
        }
        .cat-card:hover {
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3) !important;
            border-color: var(--gold) !important;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { animation: goldGlow 3s infinite alternate; }
        @keyframes goldGlow {
            from { text-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
            to { text-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
        }
    </style>

    <script>
        function applyProfessionalUpdates() {
            const logoElement = document.querySelector('.logo');
            if (logoElement) {
                logoElement.innerHTML = 'ROMEO <span style="color:white">LIVE TV</span>';
            }
            const cards = document.querySelectorAll('.cat-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = (index * 0.05) + 's';
            });
        }
        window.addEventListener('DOMContentLoaded', applyProfessionalUpdates);
    </script>
</body>
</html>
