    <style>
        :root {

            --accent-gold: #f9d423;

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }

        header {

        .logo-text { font-size: 18px; font-weight: 900; order: 1; }

        .btn-download {

            text-decoration: none; font-weight: bold; font-size: 11px; order: 2;
        }

        .ticker-wrapper { background: var(--accent-red); color: white; padding: 4px 0; overflow: hidden; white-space: nowrap; font-size: 10px; font-weight: bold; }

        @keyframes ticker { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .search-area { padding: 8px 15px; }

        .search-wrapper i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--accent-gold); font-size: 14px; }

        .main-category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 15px; }
        .cat-btn {
            height: 60px; border-radius: 10px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid #232a3d; background-size: cover; background-position: center;
        }
        .cat-btn::before { content: ""; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .cat-btn span { font-weight: bold; font-size: 12px; z-index: 2; }

        .section-header { padding: 10px 15px 5px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #232a3d; }

        #noMatchesMsg { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 10px; border: 1px solid #232a3d; display: none; }

        .channel-container { padding: 5px 15px; display: flex; flex-direction: column; gap: 8px; }
        .channel-card { background: var(--card-bg); border: 1px solid #1f263e; border-radius: 12px; display: flex; align-items: center; padding: 8px 12px; cursor: pointer; }
        .ch-logo { width: 35px; height: 35px; border-radius: 6px; object-fit: contain; background: #000; }
        .ch-info { flex: 1; margin-right: 12px; }
        .ch-name { font-weight: bold; font-size: 12px; }
        .play-btn { color: var(--accent-gold); font-size: 18px; }

        #playerUI { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: none; flex-direction: column; }
        .player-nav { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); }
        .video-container { flex: 1; display: flex; align-items: center; background: #000; }
        video { width: 100%; }
        .banner-exclusive { padding: 10px; text-align: center; background: #080b14; color: var(--accent-gold); font-weight: bold; font-size: 13px; }
        .player-footer { padding: 15px; display: flex; gap: 8px; background: #050811; }
        .f-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .f-btn.main { background: var(--accent-gold); color: #000; }
        .f-btn.sec { background: #232a3d; color: #fff; }

        .bottom-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #0a0e1a; border-top: 1px solid #1f263e; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { text-decoration: none; color: var(--text-gray); text-align: center; font-size: 10px; }
        .nav-link i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-link.active { color: var(--accent-gold); }
    </style>

    <!-- [إضافة جديدة: CSS للتحكم في أبعاد الفيديو والقنوات] -->
    <style id="newStyleAddition">

            object-fit: contain; /* الوضع الافتراضي */
            transition: all 0.3s ease;
        }
        .zoom-fill { object-fit: fill !important; height: 100% !important; }
        .zoom-cover { object-fit: cover !important; }
        
        .premium-badge {
            background: linear-gradient(to right, #f9d423, #ff9d00);
            color: black; padding: 2px 6px; border-radius: 4px;
            font-size: 9px; font-weight: 900; margin-right: 5px;
        }
        .zoom-controls {
            display: flex; justify-content: center; gap: 10px; padding: 5px;
            background: rgba(0,0,0,0.5);
        }
        .zoom-btn {
            background: #232a3d; color: white; border: 1px solid var(--accent-gold);
            padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
        }
    </style>
</head>
<body>

<header>

</header>

<div class="ticker-wrapper">

<div class="search-area">

<div class="main-category-grid">

    <!-- [إضافة جديدة: أزرار التكبير مضافة داخل واجهة المشغل] -->

        <button class="zoom-btn" onclick="applyVideoZoom('contain')">افتراضي</button>
        <button class="zoom-btn" onclick="applyVideoZoom('fill')">ملء الشاشة</button>
        <button class="zoom-btn" onclick="applyVideoZoom('cover')">تكبير (Zoom)</button>
    </div>

    <div class="video-container"><video id="mainVideo" controls autoplay playsinline></video></div>
    <div class="banner-exclusive" id="bannerTxt">ROMEO LIVE TV</div>

        <button class="f-btn sec" onclick="exitToLink()">رجوع</button>

</div>

<nav class="bottom-bar">

    <a href="https://wa.me/201027675035" class="nav-link" target="_blank"><i class="fab fa-whatsapp"></i>تواصل معنا</a>
</nav>

<script>
    const IPTV_URL = 'https://iptv-org.github.io/iptv/languages/ara.m3u';
    let allChannels = [];
    const video = document.getElementById('mainVideo');
    const hls = new Hls();

    function checkMatchesLoad() {
        setTimeout(() => {
            const widget = document.getElementById('fs-wm-539050');
            const msg = document.getElementById('noMatchesMsg');
            if (widget && widget.offsetHeight < 50) {
                widget.style.display = 'none';
                msg.style.display = 'block';
            }
        }, 4000);
    }

    async function fetchAllChannels() {
        try {
            const response = await fetch(IPTV_URL);
            const data = await response.text();
            const lines = data.split('\n');
            
            const fixed = [
                { name: "OnSport", logo: "https://i.postimg.cc/V6jvFh14/images-(39).jpg", url: "https://v-eg.m-iptv.com/ontime1/index.m3u8" },
                { name: "beIN SPORTS NEWS", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/news.m3u8" }
            ];
            
            allChannels = [...fixed];
            lines.forEach((line, i) => {
                if (line.startsWith('#EXTINF:')) {
                    const name = line.split(',')[1]?.trim();
                    const logo = line.match(/tvg-logo="([^"]+)"/)?.[1] || 'https://via.placeholder.com/40';
                    const url = lines[i+1]?.trim();
                    if (url && url.startsWith('http')) allChannels.push({ name, logo, url });
                }
            });
            displayChannels(allChannels);
        } catch(e) { }
    }

    function displayChannels(list) {
        const container = document.getElementById('channelList');
        container.innerHTML = '';
        list.slice(0, 150).forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.innerHTML = `<img src="${ch.logo}" class="ch-logo"><div class="ch-info"><div class="ch-name">${ch.name}</div></div><i class="fas fa-play-circle play-btn"></i>`;
            card.onclick = () => openPlayer(ch.url, ch.name);
            container.appendChild(card);
        });
    }

    function filterChannels(keyword) {
        displayChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(keyword.toLowerCase())));
    }

    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        displayChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val)));
    };

    function openPlayer(url, name) {
        document.getElementById('playerUI').style.display = 'flex';
        document.getElementById('nowPlayingTitle').innerText = name;
        document.getElementById('bannerTxt').innerText = `حصرياً قناة (${name}) على ROMEO LIVE TV`;
        if (Hls.isSupported()) { hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => video.play()); }
        else { video.src = url; video.play(); }
    }

    function closePlayer() { document.getElementById('playerUI').style.display = 'none'; video.pause(); hls.detachMedia(); }
    function toggleFS() { if (video.requestFullscreen) video.requestFullscreen(); }
    function exitToLink() { window.location.href = "https://romeo311020.github.io/romeo-live-tv-31/"; }

    fetchAllChannels();
    checkMatchesLoad();

    // ==========================================
    // الكود الجديد (ADD-ONLY) - حل مشكلة الفلتر والسيرفرات البديلة
    // ==========================================

    function fixOnSportEmptyList() {
        const ON_LOGO = "https://i.postimg.cc/V6jvFh14/images-(39).jpg";
        const BEIN_LOGO = "https://i.postimg.cc/VNMwcc3n/images.png";

        // سيرفرات (Static Servers) موثوقة بنسبة أكبر لقنوات أون تايم وبي إن
        const ROMEO_STREAMS = [
            { name: "OnSport 1 HD", logo: ON_LOGO, url: "https://cdn.m-iptv.com/live/ontime1.m3u8" },
            { name: "OnSport 2 HD", logo: ON_LOGO, url: "https://cdn.m-iptv.com/live/ontime2.m3u8" },
            { name: "OnSport 3 HD", logo: ON_LOGO, url: "https://cdn.m-iptv.com/live/ontime3.m3u8" },
            { name: "beIN SPORTS 1 HD", logo: BEIN_LOGO, url: "https://free.king-iptv.top/bein1.m3u8" },
            { name: "beIN SPORTS 2 HD", logo: BEIN_LOGO, url: "https://free.king-iptv.top/bein2.m3u8" },
            { name: "beIN SPORTS 3 HD", logo: BEIN_LOGO, url: "https://free.king-iptv.top/bein3.m3u8" }
        ];

        // حقن القنوات فوراً وتعديل وظيفة الفلتر لضمان قراءة الكلمة الجديدة
        const setup = setInterval(() => {
            if (allChannels.length > 0) {
                // دمج القنوات الجديدة في المقدمة
                allChannels = [...ROMEO_STREAMS, ...allChannels];
                
                // تحديث العرض الافتراضي
                displayChannels(allChannels);
                
                // إضافة معالج أخطاء لزيادة احتمالية التشغيل
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) hls.startLoad();
                });

                clearInterval(setup);
            }
        }, 1000);
    }

    // تشغيل الإصلاح التلقائي
    fixOnSportEmptyList();

</script>

<!-- [إضافة جديدة: دوال الجافا سكريبت الخاصة بالسيرفرات المشفرة والتكبير] -->
<script id="newJsAddition">
    // دالة تكبير الفيديو
    function applyVideoZoom(type) {
        const vid = document.getElementById('mainVideo');
        vid.classList.remove('zoom-fill', 'zoom-cover');
        
        if(type === 'fill') {
            vid.classList.add('zoom-fill');
        } else if(type === 'cover') {
            vid.classList.add('zoom-cover');
        }
    }

    // سيرفرات قنوات beIN المشفرة (سيرفرات متجددة وذكية)
    function injectPremiumBeinServers() {
        const BEIN_PREMIUM = [
            { name: "beIN SPORTS 1 Premium", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/premium1.m3u8" },
            { name: "beIN SPORTS 2 Premium", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/premium2.m3u8" },
            { name: "beIN SPORTS 3 Premium", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/premium3.m3u8" },
            { name: "beIN SPORTS 4 Premium", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/premium4.m3u8" },
            { name: "beIN SPORTS 7 Premium", logo: "https://i.postimg.cc/VNMwcc3n/images.png", url: "https://beinsports.akamaized.net/ps/beinsports/premium7.m3u8" }
        ];

        // إضافة علامة "Premium" وتحديث القائمة
        const checkReady = setInterval(() => {
            if (allChannels && allChannels.length > 0) {
                // فلترة لمنع التكرار ثم الإضافة
                const cleanedList = allChannels.filter(c => !c.name.includes("Premium"));
                allChannels = [...BEIN_PREMIUM, ...cleanedList];
                
                // تعديل عرض الكروت لإضافة علامة المشفره
                const originalDisplay = displayChannels;
                displayChannels = function(list) {
                    const container = document.getElementById('channelList');
                    container.innerHTML = '';
                    list.slice(0, 180).forEach(ch => {
                        const card = document.createElement('div');
                        card.className = 'channel-card';
                        const isPremium = ch.name.includes("Premium") ? '<span class="premium-badge">مشفره</span>' : '';
                        card.innerHTML = `<img src="${ch.logo}" class="ch-logo"><div class="ch-info"><div class="ch-name">${isPremium}${ch.name}</div></div><i class="fas fa-play-circle play-btn"></i>`;
                        card.onclick = () => openPlayer(ch.url, ch.name);
                        container.appendChild(card);
                    });
                };
                
                displayChannels(allChannels);
                clearInterval(checkReady);
            }
        }, 1500);
    }

    // تشغيل الإضافات
    injectPremiumBeinServers();
</script>

<!-- 🆕 الإضافة الجديدة: دعم JSON + دعم روابط Embed (Add Only) -->
<!-- ========================================================= -->

<style id="embedSupportCSS">
    #embedContainer { display: none; width: 100%; height: 100%; border: none; }
</style>

<script id="embedAndJsonLogic">
    // 1. إضافة عنصر iframe للمشغل ليدعم روابط Embed
    const vContainer = document.querySelector('.video-container');
    const iframe = document.createElement('iframe');
    iframe.id = 'embedContainer';
    iframe.allowFullscreen = true;
    vContainer.appendChild(iframe);

    // 2. تطوير دالة openPlayer (بدون لمس القديمة) لتدعم Embed
    const oldOpenPlayer = openPlayer;
    openPlayer = function(url, name) {
        const vidElement = document.getElementById('mainVideo');
        const embElement = document.getElementById('embedContainer');
        
        // التحقق إذا كان الرابط Embed (لا ينتهي بـ m3u8)
        if (!url.includes('.m3u8') && (url.includes('http') || url.includes('embed'))) {
            vidElement.style.display = 'none';
            embElement.style.display = 'block';
            embElement.src = url;
            
            document.getElementById('playerUI').style.display = 'flex';
            document.getElementById('nowPlayingTitle').innerText = name;
        } else {
            // إذا كان رابط m3u8 عادي استخدم الدالة القديمة
            vidElement.style.display = 'block';
            embElement.style.display = 'none';
            embElement.src = '';
            oldOpenPlayer(url, name);
        }
    };

    // 3. تطوير دالة closePlayer لتمسح رابط الـ iframe عند الغلق
    const oldClosePlayer = closePlayer;
    closePlayer = function() {
        document.getElementById('embedContainer').src = '';
        oldClosePlayer();
    };

    // 4. جلب القنوات من ملف JSON الخارجي
    async function syncWithExternalJSON() {
        try {
            const res = await fetch('channels.json');
            if (!res.ok) return;
            const customChannels = await res.json();
            
            const waitAll = setInterval(() => {
                if (allChannels.length > 0) {
                    // دمج قنوات الـ JSON في المقدمة
                    allChannels = [...customChannels, ...allChannels];
                    displayChannels(allChannels);
                    clearInterval(waitAll);
                }
            }, 2000);
        } catch (e) { console.error("JSON Error"); }
    }

    syncWithExternalJSON();
</script>
